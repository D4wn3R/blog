server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /blog/ S3 API 透传通道（含对象写入）历史预检上限 5MiB；nginx 默认 client_max_body_size 1MiB 会先回 413
    client_max_body_size 10m;

    # 前端产物带内容哈希，长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 文本资源 gzip：JS/CSS/JSON 不压缩时传输体积约为压缩后 3 倍
    # （woff2/图片本身已压缩，不进 gzip_types）
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml image/svg+xml;

    # index.html 不强缓存：避免部署换代后浏览器持旧入口，
    # 按旧 hash 请求已不存在的 chunk（lazy import 404 失败）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 后端业务接口（含 OAuth 授权/回调 302 链路，透传即可）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RSS 订阅源：后端生成 XML（阅读器直接订阅域名/feed.xml）
    location = /feed.xml {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # RustFS 公开桶静态资源：/files/{object} → http://rustfs:9000/blog/{object}
    location /files/ {
        proxy_pass http://rustfs:9000/blog/;
        proxy_set_header Host $host;
    }

    # S3 API 透传通道（presign 直传已退役，仅为回滚观察期保留）
    location /blog/ {
        proxy_pass http://rustfs:9000;
        proxy_set_header Host $host;
    }

    # SPA fallback：非文件路径一律回 index.html（react-router 接管）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
