# ============================================================================
# 博客后端非敏感配置
#
# 分层原则：
#   - 本文件：非敏感配置（端口、模式、超时、开关、公开 URL、CORS 白名单等）
#   - 环境变量（.env / 部署环境注入）：一切敏感信息（密码、密钥、client_secret）
#
# 敏感项一律不写在本文件里，键名见 .env.example。它们在 internal/config 中
# 通过 SetDefault 注册（只注册键名、不设值），因此 env 能覆盖且不会进 git。
#
# 覆盖方式：BLOG_ 前缀 + 配置路径大写下划线
#   jwt.secret  →  BLOG_JWT_SECRET
#   mysql.dsn   →  BLOG_MYSQL_DSN
# ============================================================================

server:
  port: 8080
  mode: debug # debug / release（release 强制要求 JWT secret ≥32 位）

# ---- 敏感：DSN 含 root 密码 → 只从 BLOG_MYSQL_DSN 注入 ----

redis:
  addr: "127.0.0.1:6379" # 非敏感：主机端口
  # password → BLOG_REDIS_PASSWORD（敏感）
  db: 0

# ---- 敏感：RustFS 凭证 → 只从 BLOG_RUSTFS_ACCESS_KEY / BLOG_RUSTFS_SECRET_KEY 注入 ----
rustfs:
  endpoint: "127.0.0.1:9000" # 非敏感：主机端口
  use_ssl: false
  bucket: "blog"

jwt:
  # secret → BLOG_JWT_SECRET（敏感）
  access_expire: 30m
  refresh_expire: 720h
  unlock_expire: 10m # 加密文章解锁 token 有效期

oauth:
  base_url: "http://localhost:5173" # 前端地址：OAuth 回调完成后 302 跳回前端
  github:
    # client_id / client_secret → BLOG_OAUTH_GITHUB_CLIENT_ID / BLOG_OAUTH_GITHUB_CLIENT_SECRET（敏感）
    redirect_url: "http://localhost:8080/api/oauth/github/callback"
    ips: [] # github.com 候选连接 IP（env BLOG_OAUTH_GITHUB_IPS 逗号分隔；TLS 干扰时轮换重试）

cors:
  allowed_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

# ---- 管理员初始化：github_id → BLOG_ADMIN_GITHUB_ID（env-only，不写在此处）----
# 取法：curl https://api.github.com/users/<用户名> 拿 id 字段

tracing:
  enabled: false # 启用后按 OTel 埋点导出 trace；本地无 Jaeger 时保持关闭
  endpoint: "127.0.0.1:4317" # OTLP gRPC 端点（Jaeger v2 默认 4317）
  insecure: true # 内网/隧道明文，无需 TLS
  sample_ratio: 1 # 头部采样比例 0~1，学习期全采
  service_name: "blog-backend"
  environment: "debug" # 与 server.mode 呼应，生产建议改成 release

metrics:
  enabled: false # 启用后暴露 /metrics 供 Prometheus 抓取；与 obs 独立开关
