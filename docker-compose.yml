# 变量从同目录 .env 展开（模板见 .env.example），.env 不入库
services:
  mysql:
    image: mysql:8
    container_name: blog-mysql
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在根目录 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?请在根目录 .env 中设置 MYSQL_DATABASE}
    ports:
      # 仅限宿主机本机访问（本地调试用），禁止暴露公网；容器间走服务名互访
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - blog-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: no
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在根目录 .env 中设置 REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在根目录 .env 中设置 REDIS_PASSWORD} # 供 healthcheck 容器内展开
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - blog-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: blog-rustfs
    restart: no
    # 镜像 entrypoint 默认起 server，数据目录由 RUSTFS_VOLUMES 指定（默认 /data）
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:?请在根目录 .env 中设置 RUSTFS_ROOT_USER}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:?请在根目录 .env 中设置 RUSTFS_ROOT_PASSWORD}
    # 9000 本地调试直连用；生产 /files/ 反代走容器网络不经宿主端口，9001 控制台需 SSH 隧道访问
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    networks:
      - blog-net
    healthcheck:
      # 探活端点沿用 MinIO 兼容路径（RustFS 原生 /health 等价）
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: blog-backend
    restart: no
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      # busybox wget 探活（alpine 自带）；migrate 阶段探活失败属预期，由 retries 兜住
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    environment:
      # 容器内用服务名互访覆盖 config.yaml 中的本机地址
      BLOG_SERVER_PORT: "8080"
      BLOG_SERVER_MODE: ${BLOG_SERVER_MODE:-debug} # release 时强校验 JWT secret ≥32 位
      BLOG_MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:?请在根目录 .env 中设置 MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:?请在根目录 .env 中设置 MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai"
      BLOG_REDIS_ADDR: "redis:6379"
      BLOG_REDIS_PASSWORD: "${REDIS_PASSWORD:?请在根目录 .env 中设置 REDIS_PASSWORD}"
      BLOG_RUSTFS_ENDPOINT: "rustfs:9000"
      BLOG_RUSTFS_ACCESS_KEY: "${RUSTFS_ROOT_USER:?请在根目录 .env 中设置 RUSTFS_ROOT_USER}"
      BLOG_RUSTFS_SECRET_KEY: "${RUSTFS_ROOT_PASSWORD:?请在根目录 .env 中设置 RUSTFS_ROOT_PASSWORD}"
      # OAuth 基地址与回调地址：本地=http://localhost，生产改为你的站点域名（宿主 nginx 反代）
      BLOG_OAUTH_BASE_URL: "${BLOG_OAUTH_BASE_URL:-http://localhost}"
      BLOG_OAUTH_GITHUB_REDIRECT_URL: "${BLOG_OAUTH_GITHUB_REDIRECT_URL:-http://localhost/api/oauth/github/callback}"
      # github.com 候选连接 IP（优先轮换，用尽后回退系统 DNS；本地留空）
      BLOG_OAUTH_GITHUB_IPS: "${BLOG_OAUTH_GITHUB_IPS:-}"
    volumes:
      - ./backend/.env:/app/.env:ro # JWT_SECRET 等其余凭证兜底
    networks:
      - blog-net

  frontend:
    build: ./frontend
    container_name: blog-nginx
    restart: no
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 生产 .env 设 FRONTEND_BIND=0.0.0.0 + FRONTEND_PORT=80 对外；本地默认 127.0.0.1:8081
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8081}:80"
    networks:
      - blog-net

volumes:
  mysql-data:
    name: blog-mysql-data
  redis-data:
    name: blog-redis-data
  rustfs-data:
    name: blog-rustfs-data

networks:
  blog-net:
    driver: bridge
